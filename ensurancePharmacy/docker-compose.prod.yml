version: '3.8'

services:
  backend-prod:
    build: ./backv5
    container_name: pharmacy-backend-prod
    ports:
      - "8101:8081"
    volumes:
      - ./backv5/pharmacy_db_prod.sqlite:/app/pharmacy_db.sqlite
    environment:
      - PHARMACY_PORT=8081
      - PHARMACY_API_PREFIX=api2
      - PHARMACY_ID=1
      - ENVIRONMENT=production
    networks:
      - pharmacy-network-prod

  frontend-prod:
    build: ./pharmacy
    container_name: pharmacy-frontend-prod
    ports:
      - "8100:8080"
    environment:
      - VUE_APP_API_HOST=localhost
      - VUE_APP_IP=localhost
      - VUE_APP_ENVIRONMENT=production
    depends_on:
      - backend-prod
    networks:
      - pharmacy-network-prod

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - pharmacy-network-prod
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-prod
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - pharmacy-network-prod
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-prod
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - pharmacy-network-prod
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve-prod
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@pharmacy.com
      - ZO_ROOT_USER_PASSWORD=Complexpass#123
      - ZO_DATA_DIR=/data
      - ZO_PROMETHEUS_ENABLED=true
    volumes:
      - openobserve-data:/data
    networks:
      - pharmacy-network-prod
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  openobserve-data:

networks:
  pharmacy-network-prod:
    driver: bridge 