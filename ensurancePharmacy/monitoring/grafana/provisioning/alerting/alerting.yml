apiVersion: 1

# Contact Points - Canales de notificación
contactPoints:
  - orgId: 1
    name: Email Notifications
    receivers:
      - uid: email-unis
        type: email
        settings:
          addresses: dnestrada@unis.edu.gt;jflores@unis.edu.gt
          singleEmail: false
        disableResolveMessage: false

  - orgId: 1
    name: Slack Notifications
    receivers:
      - uid: slack-unis-project
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          recipient: '#unis-project'
          title: '🚨 Pharmacy System Alert'
          text: |-
            {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Status:* {{ .Status }}
            *Severity:* {{ .Labels.severity }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Value:* {{ .ValueString }}
            {{ end }}
        disableResolveMessage: false

  - orgId: 1
    name: Email + Slack
    receivers:
      - uid: email-unis
        type: email
        settings:
          addresses: dnestrada@unis.edu.gt;jflores@unis.edu.gt
          singleEmail: false
        disableResolveMessage: false
      - uid: slack-unis-project
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          recipient: '#unis-project'
          title: '🚨 Pharmacy System Alert'
          text: |-
            {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Status:* {{ .Status }}
            *Severity:* {{ .Labels.severity }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Value:* {{ .ValueString }}
            {{ end }}
        disableResolveMessage: false

# Notification Policies - Políticas de enrutamiento de alertas
policies:
  - orgId: 1
    receiver: Email + Slack
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Alertas críticas - notificación inmediata
      - receiver: Email + Slack
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 30m
        continue: false
      
      # Alertas de warning - notificación normal
      - receiver: Email + Slack
        matchers:
          - severity = warning
        group_wait: 30s
        repeat_interval: 4h
        continue: false

