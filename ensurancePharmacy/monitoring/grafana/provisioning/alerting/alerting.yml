apiVersion: 1

# Contact Points - Canales de notificación
contactPoints:
  - orgId: 1
    name: Email + Slack
    receivers:
      # Email Grafana
      - uid: email-unis
        type: email
        settings:
          addresses: dnestrada@unis.edu.gt;jflores@unis.edu.gt
          singleEmail: false
          subject: '🚨 Grafana Alert - {{ .GroupLabels.alertname }}'
          message: |-
            {{ range .Alerts }}
            Alert: {{ .Labels.alertname }}
            Status: {{ .Status }}
            Severity: {{ .Labels.severity }}
            Summary: {{ .Annotations.summary }}
            Description: {{ .Annotations.description }}
            
            {{ end }}
        disableResolveMessage: false
      
      # Slack Grafana
      - uid: slack-unis
        type: slack
        settings:
          recipient: '#alertas'
          title: '🚨 Grafana Alert'
          text: |-
            {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Status:* {{ .Status }}
            *Severity:* {{ .Labels.severity }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            {{ end }}
          url: ${SLACK_WEBHOOK_URL}
        disableResolveMessage: false

  - orgId: 1
    name: OpenObserve Forwarder
    receivers:
      # Webhook al servicio intermediario
      - uid: webhook-openobserve
        type: webhook
        settings:
          url: http://openobserve-alert-forwarder:5001/webhook
          httpMethod: POST
        disableResolveMessage: false

# Notification Policies - Políticas de enrutamiento de alertas
policies:
  - orgId: 1
    receiver: Email + Slack
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Alertas críticas - Grafana normal
      - receiver: Email + Slack
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 30m
        continue: true
      
      # Alertas críticas - OpenObserve forwarder
      - receiver: OpenObserve Forwarder
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 30m
        continue: false
      
      # Alertas de warning - Grafana normal
      - receiver: Email + Slack
        matchers:
          - severity = warning
        group_wait: 30s
        repeat_interval: 4h
        continue: true
      
      # Alertas de warning - OpenObserve forwarder
      - receiver: OpenObserve Forwarder
        matchers:
          - severity = warning
        group_wait: 30s
        repeat_interval: 4h
        continue: false
