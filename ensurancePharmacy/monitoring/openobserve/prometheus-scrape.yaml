scrape_configs:
  # Prometheus metrics - reuse from existing Prometheus
  - job_name: 'openobserve-self'
    static_configs:
      - targets: ['localhost:5080']

  # Jenkins Metrics via Prometheus
  - job_name: 'jenkins'
    scrape_interval: 15s
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'jenkins'
          environment: 'production'

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
          environment: 'production'

  # Backend Application
  - job_name: 'pharmacy-backend'
    scrape_interval: 10s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-prod:8081']
        labels:
          service: 'backend'
          application: 'pharmacy'
          environment: 'production'

  # Prometheus itself (to compare)
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          service: 'prometheus'

