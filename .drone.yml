kind: pipeline
type: docker
name: pharmacy-pipeline
platform:
  os: linux
  arch: arm64

workspace:
  path: /drone/src

trigger:
  event: [push, pull_request]
  branch: [master, dev, uat]

clone:
  depth: 0

steps:
  # Step 1: Backend Unit Tests
  - name: backend-tests
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - name: maven-cache
        path: /root/.m2
    commands:
      - cd ensurancePharmacy/backv5
      - mvn clean test jacoco:report
    when:
      event: [push, pull_request]

  # Step 2: Frontend Unit Tests
  - name: frontend-tests
    image: node:18-alpine
    volumes:
      - name: node-cache
        path: /root/.npm
    commands:
      - cd ensurancePharmacy/pharmacy
      - npm ci
      - npm run test || echo "Frontend tests completed"
    when:
      event: [push, pull_request]

  # Step 3: SonarQube Analysis
  - name: sonarqube-analysis
    image: sonarsource/sonar-scanner-cli:latest
    commands:
      - cd ensurancePharmacy
      - |
        sonar-scanner \
          -Dsonar.projectKey=pharmacy-backend-${DRONE_TARGET_BRANCH:-${DRONE_BRANCH}} \
          -Dsonar.sources=backv5/src/main/java \
          -Dsonar.tests=backv5/src/test/java \
          -Dsonar.test.inclusions=**/*Test.java,**/*Tests.java \
          -Dsonar.java.coveragePlugin=jacoco \
          -Dsonar.coverage.jacoco.xmlReportPaths=backv5/target/site/jacoco/jacoco.xml \
          -Dsonar.java.binaries=backv5/target/classes \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.token=sqa_462a803ba2044049329e1e655ca728b67e12d24b
    depends_on:
      - backend-tests
    when:
      event: [push, pull_request]

  # Step 4: Quality Gate Check
  - name: quality-gate
    image: curlimages/curl:latest
    commands:
      - |
        echo "Waiting for Quality Gate result..."
        sleep 30
        
        PROJECT_KEY="pharmacy-backend-${DRONE_TARGET_BRANCH:-${DRONE_BRANCH}}"
        QUALITY_GATE_STATUS=$(curl -s -u "sqa_462a803ba2044049329e1e655ca728b67e12d24b:" \
          "http://localhost:9000/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" \
          | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
        
        echo "Quality Gate Status: ${QUALITY_GATE_STATUS}"
        
        if [ "${QUALITY_GATE_STATUS}" != "OK" ]; then
          echo "Quality Gate failed!"
          exit 1
        else
          echo "Quality Gate passed!"
        fi
    depends_on:
      - sonarqube-analysis
    when:
      event: [push, pull_request]

  # Step 5: Deploy Development
  - name: deploy-development
    image: docker/compose:latest
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - cd ensurancePharmacy
      - echo "Deploying to Development environment"
      - docker-compose -f docker-compose.dev.yml down || true
      - docker-compose -f docker-compose.dev.yml up -d --build
      - sleep 30
      - echo "Development deployment completed!"
      - echo "Frontend - http://localhost:8083"
      - echo "Backend - http://localhost:8084"
    depends_on:
      - quality-gate
    when:
      branch: dev
      event: [push]

  # Step 6: Deploy UAT
  - name: deploy-uat
    image: docker/compose:latest
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - cd ensurancePharmacy
      - echo "Deploying to UAT environment"
      - docker-compose -f docker-compose.uat.yml down || true
      - docker-compose -f docker-compose.uat.yml up -d --build
      - sleep 30
      - echo "UAT deployment completed!"
      - echo "Frontend - http://localhost:8090"
      - echo "Backend - http://localhost:8091"
    depends_on:
      - quality-gate
    when:
      branch: uat
      event: [push]

  # Step 7: Deploy Production
  - name: deploy-production
    image: docker/compose:latest
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - cd ensurancePharmacy
      - echo "Deploying to Production environment"
      - docker-compose -f docker-compose.prod.yml down || true
      - docker-compose -f docker-compose.prod.yml up -d --build
      - sleep 30
      - echo "Production deployment completed!"
      - echo "Frontend - http://localhost:8100"
      - echo "Backend - http://localhost:8101"
    depends_on:
      - quality-gate
    when:
      branch: [master, main]
      event: [push]

  # Step 8: Verify Development
  - name: verify-dev
    image: curlimages/curl:latest
    commands:
      - |
        echo "Verificando deployment DEV..."
        for i in 1 2 3 4 5; do
          if curl -fsS http://localhost:8083 > /dev/null; then 
            echo "Frontend DEV OK"; break
          else 
            echo "Frontend intento $i falló"; sleep 5
          fi
        done
        for i in 1 2 3 4 5; do
          if curl -fsS http://localhost:8084 > /dev/null; then 
            echo "Backend DEV OK"; break
          else 
            echo "Backend intento $i falló"; sleep 5
          fi
        done
    depends_on:
      - deploy-development
    when:
      branch: dev
      event: [push]

  # Step 9: Verify UAT
  - name: verify-uat
    image: curlimages/curl:latest
    commands:
      - |
        echo "Verificando deployment UAT..."
        for i in 1 2 3 4 5; do
          if curl -fsS http://localhost:8090 > /dev/null; then 
            echo "Frontend UAT OK"; break
          else 
            echo "Frontend intento $i falló"; sleep 5
          fi
        done
        for i in 1 2 3 4 5; do
          if curl -fsS http://localhost:8091 > /dev/null; then 
            echo "Backend UAT OK"; break
          else 
            echo "Backend intento $i falló"; sleep 5
          fi
        done
    depends_on:
      - deploy-uat
    when:
      branch: uat
      event: [push]

  # Step 10: Verify Production
  - name: verify-production
    image: curlimages/curl:latest
    commands:
      - |
        echo "Verificando deployment PRODUCTION..."
        for i in 1 2 3 4 5; do
          if curl -fsS http://localhost:8100 > /dev/null; then 
            echo "Frontend PROD OK"; break
          else 
            echo "Frontend intento $i falló"; sleep 5
          fi
        done
        for i in 1 2 3 4 5; do
          if curl -fsS http://localhost:8101 > /dev/null; then 
            echo "Backend PROD OK"; break
          else 
            echo "Backend intento $i falló"; sleep 5
          fi
        done
    depends_on:
      - deploy-production
    when:
      branch: [master, main]
      event: [push]

volumes:
  - name: maven-cache
    host:
      path: /tmp/drone-maven-cache
  - name: node-cache
    host:
      path: /tmp/drone-node-cache
  - name: docker-sock
    host:
      path: /var/run/docker.sock

---
# Notification pipeline
kind: pipeline
type: docker
name: notifications

steps:
  - name: email-notification
    image: drillster/drone-email
    settings:
      host: smtp.gmail.com
      port: 587
      username:
        from_secret: email_username
      password:
        from_secret: email_password
      from:
        from_secret: email_from
      to: "dnestrada@unis.edu.gt,jflores@unis.edu.gt"
      subject: "{{#success build.status}}✅ Deploy exitoso{{else}}❌ Pipeline fallido{{/success}} - {{repo.name}} [{{build.branch}}]"
      body: |
        {{#success build.status}}✅ Deploy completado exitosamente en rama {{build.branch}}.

        🎯 Quality Gate: APROBADO
        ✅ Tests: PASADOS  
        🚀 Deploy: EXITOSO

        🔗 Detalles: {{build.link}}

        🌐 Servicios disponibles:
        {{#equal build.branch "dev"}}• Frontend: http://localhost:8083
        • Backend: http://localhost:8084{{/equal}}{{#equal build.branch "uat"}}• Frontend: http://localhost:8090
        • Backend: http://localhost:8091{{/equal}}{{#equal build.branch "master"}}• Frontend: http://localhost:8100
        • Backend: http://localhost:8101{{/equal}}{{else}}❌ Pipeline falló en rama {{build.branch}}.

        🔗 Detalle: {{build.link}}

        🔍 Para diagnosticar:
        1. Revisar logs en Drone UI
        2. Verificar Quality Gate en SonarQube
        3. Revisar estado de contenedores{{/success}}
    when:
      status: [success, failure]

trigger:
  status: [success, failure]

depends_on:
  - pharmacy-pipeline
